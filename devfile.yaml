schemaVersion: 2.2.2
metadata:
  name: rhdh-gitops-ns-demo
  displayName: rhdh-gitops-ns-demo
  description: Node.js UDI app provisioned with GitOps pre-created Dev Spaces namespace
  tags:
    - UDI
    - Node
  attributes:
    metadata.openshift.io/scopes: ['devspaces']

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.30
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: NODEJS_VERSION
          value: "20"
        - name: PORT
          value: "3000"
      endpoints:
        - name: api
          targetPort: 3000
          exposure: public
          protocol: http

commands:
  - id: test
    exec:
      component: tools
      workingDir: ${PROJECTS_ROOT}/rhdh-gitops-ns-demo
      commandLine: npm test
      group:
        kind: test
        isDefault: true
  - id: run
    exec:
      component: tools
      workingDir: ${PROJECTS_ROOT}/rhdh-gitops-ns-demo
      commandLine: npm start
      group:
        kind: run
        isDefault: true
